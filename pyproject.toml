[build-system]
requires = ["scikit-build-core==1.1.1", "nanobind==3.1.0"]
build-backend = "scikit_build_core.build"

[project]
name = "fugatensor"
version = "0.1.0"
description = "Fuga tensor IR and native graph analysis with ASK execution"
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
  "License :: OSI Approved :: Apache Software License",
]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
pure = []
test = ["pytest>=8,<10"]
all = ["triton>=3.9,<3.10"]

[tool.scikit-build]
minimum-version = "1.1"
build-dir = "build/native/{wheel_tag}"
wheel.packages = ["src/fugatensor"]
cmake.version = ">=3.28"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
markers = [
  "cuda: physical CUDA execution",
  "triton: external Triton worker and CUDA execution",
  "shared_engine: reuse an Engine across numerical matrix cases",
]
