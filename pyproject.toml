[build-system]
requires = ["scikit-build-core==1.1.1", "nanobind==3.1.0"]
build-backend = "scikit_build_core.build"

[project]
name = "fugatensor"
version = "0.1.0"
description = "Fuga tensor IR and native graph analysis with ASK execution"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
pure = []
all = ["triton>=3.9,<3.10"]

[tool.scikit-build]
minimum-version = "1.1"
build-dir = "build/native/{wheel_tag}"
wheel.packages = ["src/fugatensor"]
cmake.version = ">=3.28"
